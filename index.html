body {

    text-align: center;
}

.container {
    width: 65%;
    margin: 30px auto;
    background-color: white;
    padding: 20px;
    border-radius: 10px;
}

/* =========================
   GENERAL BUTTON
========================= */

button {
    padding: 10px 20px;
    font-size: 18px;
    margin: 10px 0;
    cursor: pointer;
}

/* =========================
   START BUTTON
========================= */

#startForm button {
    display: block;
    margin: 15px auto;
}

/* =========================
   INPUT FIELDS
========================= */

input[type="text"] {
    padding: 8px;
    margin: 8px;
    width: 60%;
    box-sizing: border-box;
}

/* =========================
   QUESTION
========================= */

#questionBox {
    text-align: left;
    margin-left: 5%;
    margin-right: 5%;
}

#questionBox h3 {
    text-align: left;
    margin-bottom: 20px;
}

/* =========================
   ANSWER OPTIONS
========================= */

#optionsBox {
    text-align: left;
    margin-left: 5%;
    margin-right: 5%;
}

#optionsBox label {
    display: block;
    text-align: left;
    padding: 8px 0;
    margin: 2px 0;
    cursor: pointer;
}

/* RADIO BUTTON */

#optionsBox input[type="radio"] {
    width: auto;
    margin: 0 10px 0 0;
    padding: 0;
}

/* =========================
   NEXT / SUBMIT BUTTON
   SLIGHTLY AHEAD FROM LEFT
========================= */

#nextBtn {
    display: block;
    margin-left: 8%;
    margin-top: 20px;
}

/* =========================
   RESULT PAGE
========================= */

#resultBox {
    text-align: center;
}

#resultBox h2,
#resultBox h3,
#resultBox p {
    text-align: center;
}

#resultBox button {
    display: block;
    margin: 12px auto;
}

/* =========================
   WRONG ANSWERS PAGE
========================= */

#wrongBox {
    text-align: center;
}

#wrongBox h2,
#wrongBox h3,
#wrongBox p {
    text-align: center;
}

#wrongBox hr {
    width: 80%;
}

#wrongBox button {
    display: block;
    margin: 12px auto;
}

/* =========================
   MOBILE SCREEN
========================= */

@media screen and (max-width: 700px) {

    .container {
        width: 90%;
        padding: 15px;
    }

    input[type="text"] {
        width: 80%;
    }

    #questionBox,
    #optionsBox {
        margin-left: 3%;
        margin-right: 3%;
    }

    #nextBtn {
        margin-left: 6%;
    }

}

</style>

</head>

let askedIndexes = [];
let currentQ;
let questionCount = 0;
let score = 0;
let selected = -1;
let wrongAnswers = [];


/* =========================================
   START TEST
========================================= */

function startTest() {

    firstName =
        document.getElementById("fname").value.trim();

    lastName =
        document.getElementById("lname").value.trim();

    userClass =
        document.getElementById("userClass").value.trim();


    if (
        firstName === "" ||
        lastName === "" ||
        userClass === ""
    ) {

        alert("Please fill all fields!");

        return;
    }


    document.getElementById("quizBox").innerHTML =

        '<h2>General Knowledge Test</h2>' +

        '<div id="questionBox"></div>' +

        '<div id="optionsBox"></div>' +

        '<button onclick="nextQuestion()" id="nextBtn">' +
        'Next' +
        '</button>';


    loadQuestion();
}


/* =========================================
   LOAD QUESTION
========================================= */

function loadQuestion() {

    selected = -1;

    let rand;


    do {

        rand =
            Math.floor(
                Math.random() *
                allQuestions.length
            );

    } while (
        askedIndexes.includes(rand)
    );


    askedIndexes.push(rand);

    currentQ =
        allQuestions[rand];

    questionCount++;


    document.getElementById("questionBox").innerHTML =

        "<h3>Q" +
        questionCount +
        ". " +
        currentQ.q +
        "</h3>";


    let html = "";


    for (
        let i = 0;
        i < currentQ.o.length;
        i++
    ) {

        html +=

            '<label>' +

            '<input type="radio" ' +

            'name="opt" ' +

            'onclick="selectOption(' +
            i +
            ')">' +

            currentQ.o[i] +

            '</label>';
    }


    document.getElementById("optionsBox").innerHTML =
        html;


    if (questionCount === 20) {

        document.getElementById("nextBtn").innerText =
            "Submit";
    }
}


/* =========================================
   SELECT OPTION
========================================= */

function selectOption(i) {

    selected = i;
}


/* =========================================
   NEXT / SUBMIT
========================================= */

function nextQuestion() {

    if (selected === -1) {

        alert("Please select an option!");

        return;
    }


    if (selected === currentQ.a) {

        score += 5;

    } else {

        wrongAnswers.push({

            question: currentQ.q,

            selected:
                currentQ.o[selected],

            correct:
                currentQ.o[currentQ.a]

        });
    }


    if (questionCount < 20) {

        loadQuestion();

    } else {

        showResult();

    }
}


/* =========================================
   RESULT PAGE
========================================= */

function showResult() {

    let percent = score;


    let msg =
        percent >= 50
        ? "Congratulations! You passed."
        : "You failed.";


    document.getElementById("quizBox").innerHTML =

        '<div id="resultBox">' +

        '<h2>General Knowledge Test</h2>' +

        '<h3>Result</h3>' +

        '<p><b>Name:</b> ' +
        firstName +

        lastName +
        '</p>' +

        '<p><b>Class:</b> ' +
        userClass +
        '</p>' +

        '<h3>Score: ' +
        score +
        '/100</h3>' +

        '<h3>Percentage: ' +
        percent +
        '%</h3>' +

        '<p>' +
        msg +
        '</p>' +

        '<button onclick="showWrong()">' +
        'Show Wrong Answers' +
        '</button>' +

        '<button onclick="location.reload()">' +
        'Home' +
        '</button>' +

        '</div>';
}


/* =========================================
   WRONG ANSWERS PAGE
========================================= */

function showWrong() {

    let html =

        '<div id="wrongBox">' +

        '<h2>Wrong Answers</h2>' +

        '<h3>' +

        firstName +
        ' ' +
        lastName +

        ' (' +

        userClass +

        ')</h3>';


    if (wrongAnswers.length === 0) {

        html +=
            "<p>All answers correct 🎉</p>";

    } else {

        wrongAnswers.forEach(
            function(w, i) {

                html +=

                    '<p><b>Q' +
                    (i + 1) +
                    ': </b>' +
                    w.question +
                    '</p>' +

                    '<p><b>Your Answer:</b> ' +
                    w.selected +
                    '</p>' +

                    '<p><b>Correct Answer:</b> ' +
                    w.correct +
                    '</p>' +

                    '<hr>';
            }
        );
    }


    html +=

        '<button onclick="showResult()">' +
        'Back' +
        '</button>' +

        '<button onclick="location.reload()">' +
        'Home' +
        '</button>' +

        '</div>';


    document.getElementById("quizBox").innerHTML =
        html;
}
