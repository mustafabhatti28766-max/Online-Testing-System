// ===== VARIABLES =====

let askedIndexes = [];
let currentQ;
let questionCount = 0;
let score = 0;
let selected = -1;
let wrongAnswers = [];


// ===== LOAD QUESTION =====

function loadQuestion() {

    selected = -1;

    let rand;

    do {
        rand = Math.floor(Math.random() * allQuestions.length);
    } while (askedIndexes.includes(rand));

    askedIndexes.push(rand);

    currentQ = allQuestions[rand];

    questionCount++;

    document.getElementById("questionBox").innerHTML =
        "<h3>Q" + questionCount + ". " + currentQ.q + "</h3>";

    let html = "";

    for (let i = 0; i < currentQ.o.length; i++) {

        html +=
            '<label>' +
            '<input type="radio" name="opt" onclick="selectOption(' + i + ')">' +
            currentQ.o[i] +
            '</label>';
    }

    document.getElementById("optionsBox").innerHTML = html;

    if (questionCount == 20) {
        document.getElementById("nextBtn").innerText = "Submit";
    }
}


// ===== SELECT OPTION =====

function selectOption(i) {

    selected = i;
}


// ===== NEXT QUESTION =====

function nextQuestion() {

    if (selected == -1) {

        alert("Please select an option!");
        return;
    }

    if (selected == currentQ.a) {

        score += 5;

    } else {

        wrongAnswers.push({

            question: currentQ.q,

            selected: currentQ.o[selected],

            correct: currentQ.o[currentQ.a]

        });
    }

    if (questionCount < 20) {

        loadQuestion();

    } else {

        showResult();
    }
}


// ===== RESULT =====

function showResult() {

    let percent = score;

    let msg = percent >= 50 ?
        "Congratulations! You passed." :
        "You failed.";

    document.getElementById("quizBox").innerHTML =

        '<h2>General Knowledge Test</h2>' +

        '<h3>Result</h3>' +

        '<p><b>Name:</b> ' +
        firstName + ' ' + lastName +
        '</p>' +

        '<p><b>Class:</b> ' +
        userClass +
        '</p>' +

        '<h3>Score: ' +
        score +
        '/100</h3>' +

        '<h3>Percentage: ' +
        percent +
        '%</h3>' +

        '<p>' +
        msg +
        '</p>' +

        '<button onclick="showWrong()">Show Wrong Answers</button>' +

        '<button onclick="location.reload()">Home</button>';
}


// ===== WRONG ANSWERS =====

function showWrong() {

    let html =
        '<h2>Wrong Answers</h2>' +

        '<h3>' +
        firstName + ' ' +
        lastName +
        ' (' +
        userClass +
        ')</h3>';

    if (wrongAnswers.length == 0) {

        html +=
            "<p>All answers correct 🎉</p>";

    } else {

        wrongAnswers.forEach((w, i) => {

            html +=

                '<p><b>Q' +
                (i + 1) +
                ': </b>' +
                w.question +
                '</p>' +

                '<p>Your Answer: ' +
                w.selected +
                '</p>' +

                '<p>Correct Answer: ' +
                w.correct +
                '</p>' +

                '<hr>';
        });
    }

    html +=
        '<button onclick="location.reload()">Home</button>';

    document.getElementById("quizBox").innerHTML = html;
}
